<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Delivery | CryptoShare</title>
    <style>
        :root { 
            --primary: #34d399; /* Pastel Green */
            --primary-hover: #059669; 
            --bg-dark: #0f172a; 
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
        }
        
        body { 
            font-family: 'Inter', sans-serif; 
            background: radial-gradient(circle at bottom left, #064e3b, var(--bg-dark)); 
            color: #f8fafc;
            display: flex; justify-content: center; align-items: center; 
            height: 100vh; margin: 0; padding: 20px;
        }
        
        .card { 
            background: var(--glass-bg); 
            backdrop-filter: blur(16px); 
            -webkit-backdrop-filter: blur(16px);
            padding: 40px; border-radius: 20px; 
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5); 
            border: 1px solid var(--glass-border);
            width: 100%; max-width: 450px; text-align: center; position: relative;
        }
        
        .badge { background: rgba(239, 68, 68, 0.2); color: #fca5a5; font-size: 12px; padding: 6px 14px; border-radius: 20px; font-weight: 600; display: inline-block; margin-bottom: 25px; border: 1px solid rgba(239, 68, 68, 0.3);}
        
        .filename-box { background: rgba(0,0,0,0.3); border: 1px solid var(--glass-border); padding: 15px; border-radius: 10px; font-family: monospace; font-size: 15px; color: #6ee7b7; margin-bottom: 25px; word-break: break-all;}
        
        .form-group input { width: 100%; padding: 14px; background: rgba(255,255,255,0.05); border: 1px solid var(--glass-border); color: white; border-radius: 10px; font-size: 15px; margin-bottom: 20px; box-sizing: border-box; text-align: center; outline: none; transition: 0.3s;}
        .form-group input:focus { border-color: var(--primary); background: rgba(255,255,255,0.1); }
        .form-group input::placeholder { color: #64748b; }

        .btn { width: 100%; background: linear-gradient(135deg, var(--primary), var(--primary-hover)); color: #022c22; padding: 14px; border: none; border-radius: 10px; font-size: 16px; font-weight: 700; cursor: pointer; transition: 0.3s; box-shadow: 0 4px 15px rgba(52, 211, 153, 0.2);}
        .btn:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(52, 211, 153, 0.3); }
        
        .warning { font-size: 13px; color: #94a3b8; margin-top: 25px;}
    </style>
</head>
<body>
    <div class="card">
        <span class="badge">🔥 Self-Destructing Payload</span>
        <h2 style="margin: 0 0 10px 0;">Incoming Secure File</h2>
        <p style="color: #94a3b8; font-size: 14px; margin-bottom: 25px; line-height: 1.5;">You have received an end-to-end encrypted file. Provide the 44-character secret key to initiate decryption.</p>
        
        <div class="filename-box">
            📁 {{ filename }}
        </div>

        <form action="/decrypt" method="POST">
            <input type="hidden" name="filename" value="{{ filename }}">
            <div class="form-group">
                <input type="text" name="key" placeholder="Paste Decryption Key Here" required autocomplete="off">
            </div>
            <button type="submit" class="btn" onclick="setTimeout(()=> location.reload(), 2500)">🔓 Unlock & Download</button>
        </form>
        
        <p class="warning">Notice: Upon successful decryption, the payload will be permanently wiped from our secure servers.</p>
    </div>
</body>
</html>
