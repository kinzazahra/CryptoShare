<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Secure Delivery | CryptoShare AI</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

    <div class="glass-card" style="text-align: center;">
        <span class="badge" style="background: #fef2f2; color: #ef4444; border-color: #fca5a5; display: inline-block; margin-bottom: 20px;">
            ⚠️ Self-Destructing Payload
        </span>
        
        <h2 style="margin-bottom: 15px;">Secure Vault Delivery</h2>
        <p style="color: var(--text-muted); font-size: 14px; margin-bottom: 25px;">You have received an end-to-end encrypted file. Provide the 44-character secret key to initiate decryption.</p>
        
        <div style="background: #f8fafc; border: 1px dashed #cbd5e1; padding: 15px; border-radius: 12px; font-family: monospace; color: var(--primary); margin-bottom: 25px; word-break: break-all;">
            📁 {{ filename }}
        </div>

        <form action="/decrypt" method="POST">
            <input type="hidden" name="filename" value="{{ filename }}">
            <div class="form-group">
                <input type="text" name="key" placeholder="Paste Decryption Key Here" required autocomplete="off" style="text-align: center;">
            </div>
            <button type="submit" class="btn-primary" id="unlockBtn" onclick="setTimeout(()=> location.reload(), 2000)">🔓 Unlock & Download</button>
        </form>
        
        <p style="font-size: 12px; color: #94a3b8; margin-top: 25px;">Notice: Upon successful decryption, the payload will be permanently wiped from our secure servers.</p>
    </div>

    <script>
        document.getElementById('unlockBtn').addEventListener('click', function() {
            if(document.querySelector('input[name="key"]').value) {
                this.innerHTML = "Decrypting...";
            }
        });
    </script>
</body>
</html>
