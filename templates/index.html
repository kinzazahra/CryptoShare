<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CryptoShare | Admin Portal</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        :root { 
            --primary: #a78bfa; /* Pastel Purple */
            --primary-hover: #8b5cf6; 
            --bg-dark: #0f172a; 
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
            --text-main: #f8fafc; 
            --text-muted: #94a3b8; 
        }
        
        * { box-sizing: border-box; font-family: 'Inter', sans-serif; }
        
        body { 
            background: radial-gradient(circle at top right, #1e1b4b, var(--bg-dark)); 
            color: var(--text-main); 
            display: flex; flex-direction: column; align-items: center; justify-content: center; 
            min-height: 100vh; margin: 0; padding: 20px; 
        }
        
        .logout-btn { position: absolute; top: 20px; right: 20px; background: rgba(239, 68, 68, 0.2); color: #fca5a5; text-decoration: none; padding: 8px 16px; border-radius: 8px; font-size: 14px; font-weight: bold; border: 1px solid rgba(239, 68, 68, 0.3); transition: 0.3s;}
        .logout-btn:hover { background: rgba(239, 68, 68, 0.4); }
        
        .header { text-align: center; margin-bottom: 30px; }
        .header h1 { margin: 0; font-size: 36px; font-weight: 700; background: linear-gradient(to right, #c4b5fd, #a78bfa); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .header p { margin: 5px 0 0; color: var(--text-muted); font-size: 15px; }

        /* Glassmorphism Card */
        .card { 
            background: var(--glass-bg); 
            backdrop-filter: blur(12px); 
            -webkit-backdrop-filter: blur(12px);
            border-radius: 20px; 
            padding: 40px; 
            width: 100%; max-width: 500px; 
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5); 
            border: 1px solid var(--glass-border); 
        }
        
        .card h2 { margin-top: 0; font-size: 20px; border-bottom: 1px solid var(--glass-border); padding-bottom: 15px; margin-bottom: 25px; display: flex; align-items: center; gap: 10px; color: #e2e8f0;}
        
        /* Drag & Drop */
        .drop-zone { border: 2px dashed rgba(167, 139, 250, 0.4); border-radius: 12px; padding: 40px 20px; text-align: center; cursor: pointer; transition: all 0.3s ease; background: rgba(0,0,0,0.2); margin-bottom: 20px; }
        .drop-zone.dragover { border-color: var(--primary); background: rgba(167, 139, 250, 0.1); }
        .drop-zone p { margin: 0; font-size: 14px; color: var(--text-muted); pointer-events: none; }
        input[type="file"] { display: none; }

        .file-ready { display: none; border: 1px solid rgba(52, 211, 153, 0.3); background: rgba(52, 211, 153, 0.05); border-radius: 12px; padding: 20px; text-align: center; margin-bottom: 20px; }
        .file-ready p { margin: 0; color: #6ee7b7; font-weight: 600; font-size: 14px; }
        .remove-file { background: none; border: none; color: #fca5a5; cursor: pointer; font-size: 13px; margin-top: 10px; opacity: 0.8;}
        .remove-file:hover { opacity: 1; text-decoration: underline; }

        .btn { width: 100%; background: linear-gradient(135deg, var(--primary), var(--primary-hover)); color: white; border: none; padding: 14px; border-radius: 10px; font-size: 16px; font-weight: 600; cursor: pointer; transition: 0.3s; box-shadow: 0 4px 15px rgba(167, 139, 250, 0.3);}
        .btn:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(167, 139, 250, 0.4);}
        .btn:disabled { background: #475569; cursor: not-allowed; box-shadow: none; transform: none;}

        .result-box { margin-top: 25px; padding: 20px; background: rgba(52, 211, 153, 0.05); border: 1px solid rgba(52, 211, 153, 0.2); border-radius: 12px; display: none; text-align: center;}
        
        .key-display { background: rgba(0,0,0,0.3); padding: 12px; border: 1px solid var(--glass-border); border-radius: 8px; font-family: monospace; font-size: 13px; color: #6ee7b7; cursor: pointer; white-space: nowrap; overflow-x: auto; margin: 8px 0 15px 0; transition: 0.2s;}
        .key-display:hover { border-color: var(--primary); background: rgba(0,0,0,0.5);}
        
        #qrcode { display: flex; justify-content: center; margin-top: 15px; padding: 15px; background: white; border-radius: 10px; width: fit-content; margin-left: auto; margin-right: auto;}
        
        /* Toast Notification */
        #toast { visibility: hidden; min-width: 250px; background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(5px); border: 1px solid var(--primary); color: #fff; text-align: center; border-radius: 8px; padding: 16px; position: fixed; z-index: 10; left: 50%; bottom: 40px; transform: translateX(-50%); font-size: 14px; font-weight: 500; box-shadow: 0px 10px 30px rgba(0,0,0,0.5); }
        #toast.show { visibility: visible; animation: fadein 0.4s, fadeout 0.4s 2.5s; }
        @keyframes fadein { from {bottom: 0; opacity: 0;} to {bottom: 40px; opacity: 1;} }
        @keyframes fadeout { from {bottom: 40px; opacity: 1;} to {bottom: 0; opacity: 0;} }
    </style>
</head>
<body>

    <a href="/logout" class="logout-btn">Log Out</a>
    <div id="toast">✅ Copied securely to clipboard!</div>

    <div class="header">
        <h1>CryptoShare</h1>
        <p>Zero-Knowledge File Gateway</p>
    </div>

    <div class="card">
        <h2>🔒 Secure & Upload</h2>
        
        <div class="drop-zone" id="dropZone">
            <svg style="width:40px; height:40px; color:#a78bfa; margin-bottom:10px;" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path></svg>
            <p>Drag & drop a payload here, or <strong style="color:var(--primary)">browse</strong></p>
            <input type="file" id="fileInput">
        </div>

        <div class="file-ready" id="fileReady">
            <p>📁 Payload Ready: <span id="fileNameDisplay" style="font-weight: normal; color:#e2e8f0;"></span></p>
            <button class="remove-file" id="removeFileBtn">Cancel</button>
        </div>

        <button class="btn" id="uploadBtn">Encrypt & Generate Access</button>
        <div id="uploadStatus" style="display:none; text-align:center; font-size:13px; color:#94a3b8; margin-top:15px;">Encrypting with AES-128...</div>

        <div class="result-box" id="resultBox">
            <h3 style="margin: 0 0 15px 0; font-size: 16px; color: #6ee7b7;">✅ Payload Secured</h3>
            
            <label style="font-size: 12px; font-weight: 600; color: #94a3b8;">1. Magic Link (Click to copy):</label>
            <div class="key-display" id="outLink" style="color: #93c5fd;" onclick="copyData(this.innerText)"></div>

            <label style="font-size: 12px; font-weight: 600; color: #94a3b8;">2. Decryption Key (Click to copy):</label>
            <div class="key-display" id="outKey" onclick="copyData(this.innerText)"></div>

            <label style="font-size: 12px; font-weight: 600; color: #94a3b8;">3. Receiver Scan to Download:</label>
            <div id="qrcode"></div>
        </div>
    </div>

    <script>
        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('fileInput');
        const fileReady = document.getElementById('fileReady');
        const fileNameDisplay = document.getElementById('fileNameDisplay');
        const removeFileBtn = document.getElementById('removeFileBtn');
        let selectedFile = null;

        function copyData(text) {
            navigator.clipboard.writeText(text);
            const toast = document.getElementById("toast");
            toast.className = "show";
            setTimeout(function(){ toast.className = toast.className.replace("show", ""); }, 2900);
        }

        function handleFile(file) {
            selectedFile = file;
            fileNameDisplay.innerText = file.name;
            dropZone.style.display = 'none';
            fileReady.style.display = 'block';
            document.getElementById('resultBox').style.display = 'none'; 
        }

        removeFileBtn.addEventListener('click', () => {
            selectedFile = null; 
            fileInput.value = '';
            fileReady.style.display = 'none'; 
            dropZone.style.display = 'block';
        });

        // Click to browse
        dropZone.addEventListener('click', () => fileInput.click());
        
        // Drag events
        dropZone.addEventListener('dragover', (e) => { 
            e.preventDefault(); 
            dropZone.classList.add('dragover'); 
        });
        
        // THE FIX IS HERE (Cleaned up the syntax)
        dropZone.addEventListener('dragleave', () => {
            dropZone.classList.remove('dragover'); 
        });
        
        dropZone.addEventListener('drop', (e) => {
            e.preventDefault(); 
            dropZone.classList.remove('dragover');
            if (e.dataTransfer.files.length) {
                handleFile(e.dataTransfer.files[0]);
            }
        });

        fileInput.addEventListener('change', function() { 
            if (this.files.length) {
                handleFile(this.files[0]);
            }
        });

        document.getElementById('uploadBtn').addEventListener('click', async function() {
            if (!selectedFile) { 
                alert("Please select a file first."); 
                return; 
            }

            const btn = this; 
            const status = document.getElementById('uploadStatus');
            btn.disabled = true; 
            status.style.display = 'block'; 
            document.getElementById('resultBox').style.display = 'none';

            const formData = new FormData(); 
            formData.append('file', selectedFile);

            try {
                const response = await fetch('/upload', { method: 'POST', body: formData });
                const data = await response.json();

                if(response.ok) {
                    document.getElementById('outLink').innerText = data.link;
                    document.getElementById('outKey').innerText = data.key;
                    
                    document.getElementById('qrcode').innerHTML = ""; 
                    new QRCode(document.getElementById("qrcode"), {
                        text: data.link, 
                        width: 140, 
                        height: 140,
                        colorDark : "#0f172a", 
                        colorLight : "#ffffff",
                        correctLevel : QRCode.CorrectLevel.H
                    });

                    document.getElementById('resultBox').style.display = 'block';
                    removeFileBtn.click(); 
                } else {
                    alert("Error: " + (data.error || "Upload failed"));
                }
            } catch (error) { 
                alert("Server connection failed."); 
            } finally { 
                btn.disabled = false; 
                status.style.display = 'none'; 
            }
        });
    </script>
</body>
</html>
