<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CryptoShare | Zero-Knowledge Drop</title>
    <style>
        :root { --primary: #4F46E5; --primary-hover: #4338CA; --bg-color: #F3F4F6; --text-main: #1F2937; --text-muted: #6B7280; --border: #E5E7EB; }
        * { box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; margin: 0; padding: 20px; }
        
        /* Logout Button */
        .logout-btn { position: absolute; top: 20px; right: 20px; background: #EF4444; color: white; text-decoration: none; padding: 8px 16px; border-radius: 6px; font-size: 14px; font-weight: bold; }
        
        .header { text-align: center; margin-bottom: 30px; }
        .header h1 { margin: 0; font-size: 32px; color: #111827; letter-spacing: -0.5px;}
        .header p { margin: 5px 0 0; color: var(--text-muted); font-size: 15px; }

        /* WIDER CARDS for Key display */
        .dashboard { display: flex; gap: 24px; max-width: 1000px; width: 100%; flex-wrap: wrap; justify-content: center; }
        .card { background: white; border-radius: 16px; padding: 32px; width: 100%; max-width: 480px; box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1); border: 1px solid var(--border); position: relative;}
        
        .card h2 { margin-top: 0; font-size: 18px; border-bottom: 1px solid var(--border); padding-bottom: 12px; margin-bottom: 20px; display: flex; align-items: center; gap: 8px;}
        
        /* Drag & Drop */
        .drop-zone { border: 2px dashed #CBD5E1; border-radius: 8px; padding: 30px 20px; text-align: center; cursor: pointer; transition: all 0.2s ease; background-color: #F8FAFC; margin-bottom: 20px; }
        .drop-zone.dragover { border-color: var(--primary); background-color: #EEF2FF; }
        .drop-zone p { margin: 0; font-size: 14px; color: #64748B; pointer-events: none; }
        input[type="file"] { display: none; }

        /* New Selected File State */
        .file-ready { display: none; border: 1px solid #10B981; background: #ECFDF5; border-radius: 8px; padding: 20px; text-align: center; margin-bottom: 20px; }
        .file-ready p { margin: 0; color: #065F46; font-weight: 600; font-size: 14px; }
        .remove-file { background: none; border: none; color: #EF4444; text-decoration: underline; cursor: pointer; font-size: 12px; margin-top: 10px; }

        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-size: 14px; font-weight: 500; margin-bottom: 8px; }
        input[type="text"] { width: 100%; padding: 12px; border: 1px solid var(--border); border-radius: 8px; font-size: 14px; background-color: #F9FAFB; }
        
        .btn { width: 100%; background-color: var(--primary); color: white; border: none; padding: 12px; border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer; }
        .btn:disabled { background-color: #9CA3AF; cursor: not-allowed; }

        .result-box { margin-top: 20px; padding: 16px; background-color: #ECFDF5; border: 1px solid #A7F3D0; border-radius: 8px; display: none; }
        
        /* FIXED KEY BOX - Scrollable horizontally */
        .key-display { background: #fff; padding: 12px; border: 1px dashed #34D399; border-radius: 6px; font-family: monospace; font-size: 14px; color: #111827; cursor: pointer; white-space: nowrap; overflow-x: auto; margin-top: 5px;}
        
        .badge { background: #FEE2E2; color: #991B1B; font-size: 11px; padding: 4px 8px; border-radius: 12px; font-weight: 600; position: absolute; top: 32px; right: 32px; }
    </style>
</head>
<body>

    <a href="/logout" class="logout-btn">Log Out</a>

    <div class="header">
        <h1>CryptoShare AI</h1>
        <p>Zero-Knowledge, Self-Destructing File Gateway</p>
    </div>

    <div class="dashboard">
        <!-- ENCRYPT PANEL -->
        <div class="card">
            <h2>🔒 Secure & Upload</h2>
            
            <div class="drop-zone" id="dropZone">
                <p>Drag & drop a file here, or <strong style="color:var(--primary)">click to browse</strong></p>
                <input type="file" id="fileInput">
            </div>

            <!-- This appears when a file is selected -->
            <div class="file-ready" id="fileReady">
                <p>📁 File Ready: <span id="fileNameDisplay" style="font-weight: normal;"></span></p>
                <button class="remove-file" id="removeFileBtn">Remove File</button>
            </div>

            <button class="btn" id="uploadBtn">Encrypt & Generate Link</button>
            <div id="uploadStatus" style="display:none; text-align:center; font-size:13px; color:gray; margin-top:10px;">Encrypting...</div>

            <div class="result-box" id="resultBox">
                <h3 style="margin: 0 0 10px 0; font-size: 15px; color: #065F46;">✅ Secured Successfully</h3>
                
                <label style="font-size: 12px; font-weight: 600; color: #065F46;">1. Magic Link (Send this):</label>
                <div class="key-display" id="outLink" style="margin-bottom: 10px; border-color: #3B82F6;" onclick="navigator.clipboard.writeText(this.innerText); alert('Link copied to clipboard!');"></div>

                <label style="font-size: 12px; font-weight: 600; color: #065F46;">2. Decryption Key (Send separately):</label>
                <div class="key-display" id="outKey" onclick="navigator.clipboard.writeText(this.innerText); alert('Key copied to clipboard!');"></div>
            </div>
        </div>

        <!-- DECRYPT PANEL -->
        <div class="card">
            <span class="badge">🔥 Burns after 1 read</span>
            <h2>🔓 Decrypt Payload</h2>
            <form action="/decrypt" method="POST">
                <div class="form-group">
                    <label>Encrypted Filename</label>
                    <input type="text" name="filename" placeholder="e.g. secret_data.pdf.enc" required autocomplete="off">
                </div>
                <div class="form-group">
                    <label>Decryption Key</label>
                    <input type="text" name="key" placeholder="Paste your 44-character key" required autocomplete="off">
                </div>
                <button type="submit" class="btn" style="background-color: #10B981;" onclick="setTimeout(()=> location.reload(), 2000)">Unlock & Download</button>
            </form>
        </div>
    </div>

    <script>
        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('fileInput');
        const fileReady = document.getElementById('fileReady');
        const fileNameDisplay = document.getElementById('fileNameDisplay');
        const removeFileBtn = document.getElementById('removeFileBtn');
        let selectedFile = null;

        function handleFile(file) {
            selectedFile = file;
            fileNameDisplay.innerText = file.name;
            dropZone.style.display = 'none';
            fileReady.style.display = 'block';
            document.getElementById('resultBox').style.display = 'none'; // hide old results
        }

        removeFileBtn.addEventListener('click', () => {
            selectedFile = null;
            fileInput.value = '';
            fileReady.style.display = 'none';
            dropZone.style.display = 'block';
        });

        dropZone.addEventListener('click', () => fileInput.click());
        dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('dragover'); });
        dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('dragover');
            if (e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]);
        });

        fileInput.addEventListener('change', function() {
            if (this.files.length) handleFile(this.files[0]);
        });

        document.getElementById('uploadBtn').addEventListener('click', async function() {
            if (!selectedFile) { alert("Please select a file first."); return; }

            const btn = this;
            const status = document.getElementById('uploadStatus');
            btn.disabled = true; status.style.display = 'block';

            const formData = new FormData();
            formData.append('file', selectedFile);

            try {
                const response = await fetch('/upload', { method: 'POST', body: formData });
                const data = await response.json();

                if(response.ok) {
                    // Display the new Link and Key
                    document.getElementById('outLink').innerText = data.link;
                    document.getElementById('outKey').innerText = data.key;
                    
                    document.getElementById('resultBox').style.display = 'block';
                    
                    // Reset upload area
                    removeFileBtn.click(); 
                } else {
                    alert("Error: " + (data.error || "File too large (Max 16MB)"));
                }
            } catch (error) {
                alert("Server connection failed.");
            } finally {
                btn.disabled = false; status.style.display = 'none';
            }
        });
    </script>
</body>
</html>
