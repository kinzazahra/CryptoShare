<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CryptoShare AI | Zero-Knowledge Architecture</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
</head>
<body>

    <div class="header-text">
        <h1>CryptoShare AI</h1>
        <p>Secure File Sharing Without Trusting The Server.<br>End-to-End Encrypted & Self-Destructing.</p>
    </div>

    <div class="glass-card">
        <div style="text-align: center; margin-bottom: 25px;">
            <svg style="width:48px; color:var(--primary);" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
            <h2 style="margin-top: 10px;">Admin Access</h2>
        </div>

        {% if error %}
            <div style="background: #fee2e2; color: #991b1b; padding: 10px; border-radius: 8px; margin-bottom: 15px; font-size: 14px; text-align: center;">{{ error }}</div>
        {% endif %}

        <form action="/login" method="POST">
            <div class="form-group">
                <input type="text" name="username" placeholder="Admin Identity" required>
            </div>
            <div class="form-group">
                <input type="password" name="password" placeholder="Passphrase" required>
            </div>
            <button type="submit" class="btn-primary">Authenticate</button>
        </form>
    </div>

</body>
</html>
